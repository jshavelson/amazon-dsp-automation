AWSTemplateFormatVersion: '2010-09-09'
Description: DSP operations web application, protected dashboard, and HTTPS edge.

Parameters:
  ProjectName:
    Type: String
    Default: dsp-operations
  VpcId: {Type: AWS::EC2::VPC::Id}
  PublicSubnetAId: {Type: AWS::EC2::Subnet::Id}
  PublicSubnetBId: {Type: AWS::EC2::Subnet::Id}
  ApplicationSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  LoadBalancerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  DatabaseEndpoint: {Type: String}
  DatabasePort: {Type: Number, Default: 5432}
  DatabaseAdminSecretArn: {Type: String}
  DatabaseRuntimeSecretArn: {Type: String}
  ContainerRepositoryUri: {Type: String}
  EcsClusterName: {Type: String}
  TaskExecutionRoleArn: {Type: String}
  ApplicationTaskRoleArn: {Type: String}
  UserPoolId: {Type: String}
  UserPoolClientId: {Type: String, NoEcho: true}
  CognitoDomainPrefix: {Type: String}
  OwnerSubject: {Type: String, NoEcho: true}
  OwnerEmail: {Type: String, Default: jason@jeclogs.com}
  OriginVerify:
    Type: String
    NoEcho: true
    MinLength: 32
  ImageTag: {Type: String, Default: pilot}

Resources:
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/application'
      RetentionInDays: 30

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-web'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroupId]
      Subnets: [!Ref PublicSubnetAId, !Ref PublicSubnetBId]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: routing.http.xff_client_port.enabled, Value: 'true'}
        - {Key: deletion_protection.enabled, Value: 'false'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-web'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8787
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  OriginHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerify]
      Actions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  ApplicationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-application'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref ApplicationTaskRole
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: application
          Image: !Sub '${ContainerRepositoryUri}:${ImageTag}'
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - {ContainerPort: 8787, Protocol: tcp, AppProtocol: http}
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: HOST, Value: 0.0.0.0}
            - {Name: PORT, Value: '8787'}
            - {Name: DB_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DB_PORT, Value: !Ref DatabasePort}
            - {Name: DB_NAME, Value: dsp_platform}
            - {Name: DB_USER, Value: dsp_app_login}
            - {Name: OIDC_ISSUER, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'}
            - {Name: OIDC_AUDIENCE, Value: !Ref UserPoolClientId}
            - {Name: OIDC_JWKS_URL, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/jwks.json'}
            - {Name: AUTH_CLIENT_ID, Value: !Ref UserPoolClientId}
            - {Name: AUTHORIZATION_URL, Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'}
            - {Name: TOKEN_URL, Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'}
            - {Name: TENANT_SLUG, Value: jecs}
            - {Name: DASHBOARD_HTML_PATH, Value: /app/dashboard/amazon-dsp-kpi-dashboard.html}
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: AWS_PROFILE, Value: deploy-admin}
          Secrets:
            - {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseRuntimeSecretArn}:password::'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: application
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(\"http://127.0.0.1:8787/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20

  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dsp/credentials/*'

  BootstrapTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-database-bootstrap'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref ApplicationTaskRole
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: bootstrap
          Image: !Sub '${ContainerRepositoryUri}:${ImageTag}'
          Essential: true
          Command: [node, platform/scripts/bootstrap-database.mjs]
          Environment:
            - {Name: DB_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DB_PORT, Value: !Ref DatabasePort}
            - {Name: DB_NAME, Value: dsp_platform}
            - {Name: DB_ADMIN_USER, Value: dsp_platform_admin}
            - {Name: OWNER_SUBJECT, Value: !Ref OwnerSubject}
            - {Name: OWNER_EMAIL, Value: !Ref OwnerEmail}
            - {Name: TENANT_SLUG, Value: jecs}
            - {Name: TENANT_NAME, Value: JEC Logistics Solutions}
          Secrets:
            - {Name: DB_ADMIN_PASSWORD, ValueFrom: !Sub '${DatabaseAdminSecretArn}:password::'}
            - {Name: DB_RUNTIME_PASSWORD, ValueFrom: !Sub '${DatabaseRuntimeSecretArn}:password::'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: bootstrap
  ApplicationService:
    Type: AWS::ECS::Service
    DependsOn: OriginHeaderRule
    Properties:
      ServiceName: !Sub '${ProjectName}-application'
      Cluster: !Ref EcsClusterName
      TaskDefinition: !Ref ApplicationTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ApplicationSecurityGroupId]
          Subnets: [!Ref PublicSubnetAId, !Ref PublicSubnetBId]
      LoadBalancers:
        - ContainerName: application
          ContainerPort: 8787
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy: {ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com; frame-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'", Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: same-origin, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true, Preload: true}
          XSSProtection: {ModeBlock: true, Protection: true, Override: true}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Comment: !Sub '${ProjectName} secure application edge'
        Origins:
          - Id: application-origin
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: application-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
        ViewerCertificate: {CloudFrontDefaultCertificate: true, MinimumProtocolVersion: TLSv1.2_2021}

Outputs:
  WebsiteUrl: {Value: !Sub 'https://${Distribution.DomainName}/'}
  CloudFrontDomain: {Value: !GetAtt Distribution.DomainName}
  DistributionId: {Value: !Ref Distribution}
  ApplicationServiceName: {Value: !GetAtt ApplicationService.Name}
  ApplicationTaskDefinitionArn: {Value: !Ref ApplicationTaskDefinition}
  BootstrapTaskDefinitionArn: {Value: !Ref BootstrapTaskDefinition}
  LoadBalancerDnsName: {Value: !GetAtt LoadBalancer.DNSName}